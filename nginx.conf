# log_format nel contesto http (questo file è incluso dentro http {} dal nginx principale)
log_format tracing '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'trace_id=$http_x_trace_id span_id=$http_x_span_id';

server {
    listen 80;

    # server_name localhost;

    # Health check endpoint per Docker
    location /health {
        access_log off;
        return 200 '{"status":"UP","service":"frontend-nginx","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # CORS headers per permettere tracing dal browser
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, traceparent, tracestate, baggage, x-trace-id, x-span-id";
        add_header Access-Control-Allow-Credentials true;
    }

    location /api/ {
        # rewrite /api/(.*) /$1  break;
        proxy_pass "http://${API_HOST}:${API_PORT}/";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade, keep-alive';
        proxy_set_header Keep-Alive 'timeout=5, max=100';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # IMPORTANTE: Propaga i trace headers al backend
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
        proxy_set_header baggage $http_baggage;
        proxy_set_header x-trace-id $http_x_trace_id;
        proxy_set_header x-span-id $http_x_span_id;
    }

    # Socket.io proxy verso notification-service (usato da WebSocketGameService)
    location /socket.io/ {
        proxy_pass "http://${NOTIFICATION_HOST}:${NOTIFICATION_PORT}/socket.io/";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Gestisci preflight CORS requests (per le chiamate con trace headers)
    location ~ ^/api.*OPTIONS$ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, traceparent, tracestate, baggage, x-trace-id, x-span-id";
        add_header Access-Control-Allow-Credentials true;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                   '$status $body_bytes_sent "$http_referer" '
    #                   '"$http_user_agent" "$http_x_forwarded_for"';
    # log_format  main  '$remote_addr - $remote_user [$time_local] "$host$request_uri" '
    #                   '$status $body_bytes_sent "$http_referer" '
    #                   '"$http_user_agent" "$http_x_forwarded_for"';

location /otlp/ {
    # rewrite ^/otlp(.*)$ $1 break;

    access_log /var/log/nginx/otlp_debug.log;
    error_log /var/log/nginx/otlp_error.log debug;

    proxy_pass http://localhost:4318/;   # lo slash finale è FONDAMENTALE
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # CORS
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, traceparent, tracestate, baggage, x-trace-id, x-span-id" always;
    add_header Access-Control-Allow-Credentials true always;
}

# Preflight (OPTIONS) - più generico
location /otlp {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, traceparent, tracestate, baggage, x-trace-id, x-span-id" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}


location /jaeger-proxy {

    access_log proxy_otlp_debug.log;
    error_log proxy_otlp_error.log debug;

    proxy_pass http://localhost:4318/v1/traces/;
    proxy_http_version 1.1;
    proxy_method POST;
    proxy_set_header Host $host;
    proxy_set_header Content-Type application/json;

    # CORS
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
}

location = /jaeger-proxy {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Content-Length 0;
        return 204;
    }
}
}